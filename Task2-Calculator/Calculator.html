<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Calculator</title>

	<link rel="stylesheet" href="Calculator.css?v=2">
</head>
<body>

<br>
<h1 id="h1">Smart & Simple Web Calculator</h1>
<br>

<div style="margin-bottom: 15px;margin-left: 36px;">
    <button id="fullscreen-btn" class="btn-fullscreen">⛶ Fullscreen</button>
    <button id="theme-toggle-btn" class="btn-theme-toggle">☀️ Light Mode</button>
</div>


<div id="d1"><br><br><br>My Calculator : Making your problems easy</div>
<div id="d2">
    <div id="d3">

        <input type="text" id="screen" value="0" readonly>

        <div class="buttons">
            <button class="btn ac">AC</button>
            <button class="btn">DE</button>
            <button class="btn">%</button>
            <button class="btn operator">/</button>

            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="btn operator">*</button>

            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="btn operator">-</button>

            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="btn operator">+</button>

            <button class="btn sqrt">√</button>
            <button class="btn">0</button>
            <button class="btn">.</button>
            <button class="btn equal"><b>=</b></button>
        </div>
    </div>
</div>

<script src="calculator.js"></script>


</body>
</html>
